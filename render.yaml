# Render Blueprint: the Predas API with its database-queue worker in one free web service
# and a Render PostgreSQL database reachable only inside Render. The web client is Cloudflare
# Pages (see docs/commercial/DEPLOYMENT_CLOUD_RU.md). Render generates the database password and
# passes the connection string itself; values marked sync: false are entered in the dashboard.
databases:
  - name: predas-db
    plan: free
    region: frankfurt
    databaseName: predas
    user: predas
    ipAllowList: []

services:
  - type: web
    name: predas-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.lock
    startCommand: sh infra/render_start.sh
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ASBOLJAM_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Exactly the Cloudflare Pages origin, e.g. https://predas.pages.dev (no trailing slash).
      - key: ALLOWED_ORIGINS
        sync: false
      # Internal connection string of predas-db. To use Supabase instead, replace this with
      # sync: false and enter the session pooler URL (port 5432, sslmode=require).
      - key: DATABASE_URL
        fromDatabase:
          name: predas-db
          property: connectionString
      # The pitch demo lets an establishment open a test cabinet itself; set "off" to close it.
      - key: ASBOLJAM_SELF_REGISTRATION
        value: "on"
      - key: LOKY_MAX_CPU_COUNT
        value: "1"
      - key: WORKER_CALCULATION_TIMEOUT_SECONDS
        value: "900"
      - key: IMPORT_MAX_BYTES
        value: "20971520"
      - key: IMPORT_MAX_ROWS
        value: "250000"
