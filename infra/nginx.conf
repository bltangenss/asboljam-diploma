# Application logs contain the registered route template. The proxy records no
# raw path, query, client address, headers or upstream error text in access logs.
log_format asboljam_safe escape=json '{"event":"proxy.request","status":$status,"duration_seconds":$request_time,"request_id":"$upstream_http_x_request_id"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 22m;
    access_log /dev/stdout asboljam_safe;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
